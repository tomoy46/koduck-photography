name: Unpack website ZIP

on:
  push:
    paths:
      - 'koduck-photography-initial.zip'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Unpack website
        run: |
          rm -rf .site-tmp
          mkdir .site-tmp
          unzip -q -o koduck-photography-initial.zip -d .site-tmp
          cp -a .site-tmp/koduck-photography/. ./
          rm -rf .site-tmp koduck-photography-initial.zip

      - name: Commit website files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Publish Koduck Photography website"
            git push
          fi
